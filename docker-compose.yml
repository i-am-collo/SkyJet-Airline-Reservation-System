version: '3.9'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: skyjet-postgres
    environment:
      POSTGRES_DB: skyjet_db
      POSTGRES_USER: skyjet_user
      POSTGRES_PASSWORD: skyjet_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - skyjet-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U skyjet_user -d skyjet_db" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # pgAdmin for database management (optional)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: skyjet-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@skyjet.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - skyjet-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  skyjet-network:
    driver: bridge
